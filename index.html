<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Llei Orgànica del Sistema Universitari (LOSU)</title>
    <!-- Tailwind CSS per al disseny -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome per a les icones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',

                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }

    <style>
        body {
            background-color: #f8fafc;
        }
        
        /* Animacions personalitzades */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        .slide-up {
            animation: slideUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Estils transicions de botons */
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .option-btn:active:not(:disabled) {
            transform: translateY(0);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col items-center py-10 px-4">

    <!-- Capçalera -->
    <header class="w-full max-w-3xl mb-8 text-center fade-in">
        <div class="inline-flex items-center justify-center p-3 bg-brand-100 rounded-full mb-4 text-brand-600 shadow-sm">
            <i class="fas fa-university text-2xl"></i>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-slate-900 mb-2">Quiz de la Llei Orgànica del Sistema Universitari (LOSU)</h1>
        <p class="text-lg text-slate-600">Estudi Interactiu Complet - 100 Preguntes</p>
    </header>

    <!-- Contenidor Principal de l'Aplicació -->
    <main id="app-container" class="w-full max-w-3xl flex-grow flex flex-col relative">
        
        <!-- Barra de progrés -->
        <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6 fade-in shadow-inner overflow-hidden">
            <div id="progress-bar" class="bg-brand-600 h-2.5 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>
        <div class="flex justify-between text-sm text-slate-500 font-medium mb-4 fade-in">
            <span id="question-counter">Pregunta 1 de X</span>
            <span id="score-counter">Puntuació: 0</span>
        </div>

        <!-- Targeta de la Pregunta -->
        <div id="quiz-card" class="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 md:p-10 mb-6 slide-up w-full relative z-10">
            <h2 id="question-text" class="text-xl md:text-2xl font-semibold text-slate-800 mb-8 leading-snug">
                <!-- Text de la pregunta s'inserirà aquí -->
            </h2>
            
            <div id="options-container" class="flex flex-col space-y-4">
                <!-- Opcions s'inseriran aquí via JS -->
            </div>
        </div>

        <!-- Targeta d'Explicació (Amagada inicialment) -->
        <div id="explanation-card" class="bg-slate-50 rounded-3xl shadow-lg border border-slate-200 p-6 md:p-8 mt-4 hidden slide-up relative z-0">
            <div class="flex items-start gap-4 mb-4">
                <div id="feedback-icon" class="flex-shrink-0 mt-1">
                    <!-- Icona correcte/incorrecte -->
                </div>
                <div class="w-full">
                    <h3 id="feedback-title" class="text-lg font-bold mb-2">
                        <!-- Títol de resposta -->
                    </h3>
                    <p id="explanation-text" class="text-slate-700 leading-relaxed mb-6">
                        <!-- Text de l'explicació -->
                    </p>
                    
                    <!-- Referència del document (Molt important el format exacte) -->
                    <div class="inline-flex items-center gap-2 px-4 py-3 bg-white rounded-xl border border-slate-200 shadow-sm text-sm font-semibold text-slate-600 w-full break-words">
                        <i class="fas fa-file-pdf text-red-500 text-lg"></i>
                        <span id="reference-text" class="leading-tight"></span>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 flex justify-end">
                <button id="next-btn" class="px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition-colors shadow-md flex items-center gap-2">
                    Següent Pregunta <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- Targeta de Resultats (Amagada inicialment) -->
        <div id="results-card" class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8 md:p-12 text-center hidden slide-up">
            <div class="inline-flex items-center justify-center p-5 bg-emerald-100 rounded-full mb-6 text-emerald-600 shadow-sm">
                <i class="fas fa-trophy text-5xl"></i>
            </div>
            <h2 class="text-3xl md:text-4xl font-bold text-slate-900 mb-4">Resum de l'Estudi</h2>
            <p class="text-lg text-slate-600 mb-8">Has completat el test interactiu complet sobre la Llei orgànica 2/2023.</p>
            
            <div class="flex justify-center gap-12 mb-10 p-6 bg-slate-50 rounded-2xl border border-slate-100">
                <div class="text-center">
                    <p class="text-sm text-slate-500 uppercase tracking-wide font-semibold mb-2">Encerts</p>
                    <p id="final-score" class="text-5xl font-bold text-emerald-600">0</p>
                </div>
                <div class="w-px bg-slate-200"></div>
                <div class="text-center">
                    <p class="text-sm text-slate-500 uppercase tracking-wide font-semibold mb-2">Total</p>
                    <p id="total-questions" class="text-5xl font-bold text-slate-700">0</p>
                </div>
            </div>
            
            <button id="restart-btn" class="px-8 py-4 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl transition-colors shadow-lg flex items-center justify-center gap-3 mx-auto w-full md:w-auto text-lg">
                <i class="fas fa-redo-alt"></i> Tornar a començar
            </button>
        </div>

    </main>

    <footer class="mt-12 mb-6 text-center text-slate-400 text-sm">
        <p>Dissenyat per a l'estudi de la LOSU</p>
    </footer>

    <script>
        // L'array complet de 100 preguntes exactament tal i com ho has demanat.
        const questionsData = [
          { q: "Quina institució és fonamental en la societat del coneixement segons el preàmbul?", o: ["La universitat", "L'empresa", "L'Estat", "L'escola primària"], a: 0, exp: "El preàmbul destaca la universitat com a institució fonamental.", p: 1 },
          { q: "Quines són les funcions centrals de l'activitat universitària a part de docència i recerca?", o: ["Compartir i transferir coneixement", "Generar beneficis econòmics", "Formar polítics", "Competir amb altres estats"], a: 0, exp: "Docència, recerca i transferència constitueixen funcions centrals.", p: 2 },
          { q: "Quant s'ha duplicat l'estudiantat universitari en les últimes quatre dècades?", o: ["Ha superat àmpliament el milió i mig", "Arriba als tres milions", "No ha augmentat", "S'ha reduït a la meitat"], a: 0, exp: "L'estudiantat universitari ha superat àmpliament el milió i mig.", p: 3 },
          { q: "Quina llei orgànica persegueix aquesta reforma integral?", o: ["La Llei Orgànica del Sistema Universitari", "La Llei d'Educació Secundària", "La Llei de Formació Professional", "La Llei de Bases de Règim Local"], a: 0, exp: "Es tracta de la Llei Orgànica del Sistema Universitari (LOSU).", p: 4 },
          { q: "Quina dimensió essencial docent inclou la Llei per a totes les edats?", o: ["Formació al llarg de la vida", "Educació obligatòria", "Màsters obligatoris", "Doctorats honorífics"], a: 0, exp: "La formació permanent o al llarg de tota la vida és essencial.", p: 5 },
          { q: "Quin és el compromís mínim de finançament públic del PIB recollit a la llei?", o: ["1% del PIB", "2% del PIB", "0,5% del PIB", "3% del PIB"], a: 0, exp: "S'estableix assolir un mínim de finançament públic de l'1% del PIB.", p: 6 },
          { q: "Quin és el límit màxim de contractes temporals de personal docent i investigador (PDI)?", o: ["Es redueix del 40 al 8 per cent", "Del 50 al 20 per cent", "Es manté al 40 per cent", "No hi ha límit fixat"], a: 0, exp: "La llei redueix del 40 al 8 per cent el màxim de contractes temporals del PDI.", p: 7 },
          { q: "A què es vincula la beca en el nou sistema descrit a la llei?", o: ["A un dret subjectiu vinculat a la situació socioeconòmica", "Només a l'excel·lència acadèmica", "A l'edat de l'estudiant", "Al lloc de naixement"], a: 0, exp: "Es concep la beca com un dret subjectiu vinculat a la situació socioeconòmica.", p: 8 },
          { q: "Quina normativa queda derogada expressament per aquesta llei orgànica?", o: ["La Llei orgànica 6/2001, de 21 de desembre, d'universitats", "La Constitució Espanyola", "L'Estatut dels Treballadors", "La Llei General de Sanitat"], a: 0, exp: "La disposició derogatòria deixa sense vigència expressament la LO 6/2001.", p: 9 },
          { q: "Quin és l'objecte d'aquesta Llei orgànica (Art. 1)?", o: ["La regulació del sistema universitari", "La regulació del transport públic", "La sanitat pública", "La defensa nacional"], a: 0, exp: "L'objecte és la regulació del sistema universitari i els mecanismes de coordinació.", p: 10 },
          { q: "Quina és una funció de la universitat segons l'Art. 2?", o: ["La preparació per a l'exercici d'activitats professionals", "El control de fronteres", "L'emissió de moneda", "L'administració de justícia"], a: 0, exp: "La preparació professional mitjançant coneixements científics és funció de la universitat.", p: 11 },
          { q: "Quin dret fonamental empara l'autonomia de les universitats (Art. 3)?", o: ["Article 27.10 de la Constitució espanyola", "Article 15 de la Constitució espanyola", "Article 155 de la Constitució espanyola", "Article 1 de la Constitució espanyola"], a: 0, exp: "L'autonomia s'exerceix en virtut de l'article 27.10 de la Constitució.", p: 12 },
          { q: "Què garanteix l'autonomia universitària pel que fa al professorat (Art. 3.3)?", o: ["La llibertat de càtedra", "El dret a vaga", "El dret a la imatge", "L'exempció d'impostos personals"], a: 0, exp: "L'autonomia universitària garanteix la llibertat de càtedra del professorat.", p: 13 },
          { q: "Com es portarà a terme la creació d'universitats públiques (Art. 4.1)?", o: ["Per una llei de l'assemblea legislativa de la comunitat autònoma", "Per reial decret llei", "Per ordre ministerial", "Per decisió del rector"], a: 0, exp: "Es fa per llei de l'assemblea legislativa de la comunitat autònoma.", p: 14 },
          { q: "Qui té la responsabilitat de l'assegurament de la qualitat (Art. 5.2)?", o: ["Responsabilitat compartida per universitats, agències i administracions públiques", "Únicament l'Estat", "Només les universitats privades", "Els estudiants"], a: 0, exp: "És una responsabilitat compartida per les universitats, agències d'avaluació i administracions.", p: 15 },
          { q: "Com s'imparteix la docència de forma preferent (Art. 6.1)?", o: ["De manera presencial", "Exclusivament online", "Per correu postal", "Només a l'estranger"], a: 0, exp: "La docència, preferentment presencial, es pot impartir també de manera virtual o híbrida.", p: 16 },
          { q: "On s'han d'inscriure els títols universitaris de caràcter oficial (Art. 7.3)?", o: ["En el Registre d'universitats, centres i títols (RUCT)", "Al Registre Civil", "Al Ministeri de Treball", "Als arxius municipals"], a: 0, exp: "Els títols oficials s'inscriuen al Registre d'universitats, centres i títols.", p: 17 },
          { q: "Quins són els tres cicles en què s'estructuren els ensenyaments oficials (Art. 9.1)?", o: ["Grau, màster universitari i doctorat", "Primària, secundària i batxillerat", "Llicenciatura, diplomatura i curs d'adaptació", "Cicle inicial, mitjà i superior"], a: 0, exp: "S'estructuren en tres cicles: grau, màster universitari i doctorat.", p: 18 },
          { q: "Qui estableix les condicions d'homologació de títols oficials estrangers (Art. 10)?", o: ["El Govern, amb l'informe previ del Consell d'Universitats", "Cada universitat autònomament", "El Tribunal Suprem", "L'Ajuntament on s'ubiqui la universitat"], a: 0, exp: "Correspon regular al Govern, amb informe previ del Consell d'Universitats.", p: 19 },
          { q: "Com es considera el coneixement científic segons l'Art. 12?", o: ["Un bé comú", "Una propietat privada de la universitat", "Un recurs de pagament", "Un secret d'Estat"], a: 0, exp: "El coneixement científic té la consideració d'un bé comú (ciència oberta).", p: 20 },
          { q: "Què ha de fer el PDI amb la versió final acceptada d'una publicació (Art. 12.2)?", o: ["Dipositar-la en repositoris institucionals d'accés obert", "Vendre-la a editorials internacionals", "Destruir els esborranys", "Guardar-la en secret fins la patent"], a: 0, exp: "El PDI ha de dipositar-la en accés obert de forma simultània a la publicació.", p: 21 },
          { q: "Com han de ser les comissions d'avaluació de projectes de recerca (Art. 13.2)?", o: ["Amb composició equilibrada entre homes i dones", "Formades exclusivament per catedràtics", "Compostes només per investigadors internacionals", "Anònimes"], a: 0, exp: "S'han d'ajustar al principi de composició equilibrada entre homes i dones.", p: 22 },
          { q: "Quins són els òrgans de cooperació i coordinació del sistema universitari (Art. 14.1)?", o: ["La Conferència General de Política Universitària i el Consell d'Universitats", "El Congrés i el Senat", "Els Consells Socials de les CCAA", "Les agències autonòmiques exclusivament"], a: 0, exp: "La Conferència General i el Consell d'Universitats són els òrgans de coordinació.", p: 23 },
          { q: "Qui presideix la Conferència General de Política Universitària (Art. 15.2)?", o: ["El ministre o ministra d'Universitats", "El President del Govern", "El Rei", "Un rector escollit a l'atzar"], a: 0, exp: "Està sota la presidència del ministre o ministra d'Universitats.", p: 24 },
          { q: "Què és el Consell d'Universitats (Art. 16.1)?", o: ["L'òrgan de coordinació acadèmica del sistema universitari espanyol", "Un sindicat d'estudiants", "L'òrgan que recapta les taxes", "Una associació de catedràtics"], a: 0, exp: "És l'òrgan de coordinació acadèmica, adscrit al Ministeri d'Universitats.", p: 25 },
          { q: "Quina és una funció del Consell d'Estudiants Universitari de l'Estat (Art. 17.3)?", o: ["Ser interlocutor davant el Ministeri d'Universitats", "Aprovar els pressupostos de l'Estat", "Nomenar el Ministre", "Elegir als rectors de tota Espanya"], a: 0, exp: "Té com a funció ser interlocutor davant el Ministeri d'Universitats.", p: 26 },
          { q: "A què han de contribuir les universitats pel que fa a l'entorn territorial (Art. 18.3)?", o: ["A revertir les dinàmiques de despoblament", "A concentrar tota la població a les ciutats", "A construir indústries pesades", "A privatitzar l'entorn"], a: 0, exp: "S'han d'implicar en el desenvolupament del seu entorn i contribuir a revertir el despoblament.", p: 27 },
          { q: "Què han de fer les universitats amb els seus arxius i fons bibliotecaris (Art. 21.4)?", o: ["Digitalitzar-los i fer-los accessibles", "Vendre'ls al millor postor", "Guardar-los sense accés al públic", "Traslladar-los fora de l'Estat"], a: 0, exp: "Han de digitalitzar i fer accessibles els seus arxius i fons bibliotecaris.", p: 28 },
          { q: "Com han de ser les activitats esportives (Art. 22.1)?", o: ["Accessibles per a totes les persones", "Restringides a atletes d'elit", "Obligatòries per aprovar els graus", "Exclusives per a menors de 25 anys"], a: 0, exp: "Les activitats esportives han de ser accessibles per a totes les persones.", p: 29 },
          { q: "Qui aprova l'Estratègia d'internacionalització del sistema universitari (Art. 24.1)?", o: ["El Govern, en col·laboració amb les comunitats autònomes i universitats", "La Unió Europea de manera unilateral", "Cada facultat individualment", "El Consell de Seguretat de l'ONU"], a: 0, exp: "El Govern aprova l'Estratègia d'internacionalització del sistema universitari.", p: 30 },
          { q: "Què han de promoure el Govern, les CCAA i les universitats pel que fa a la mobilitat (Art. 27.1)?", o: ["Programes de mobilitat i intercanvi", "L'aïllament dels investigadors", "L'eliminació d'ERASMUS", "Taxes addicionals per moure's"], a: 0, exp: "Han de promoure programes de mobilitat i intercanvi de l'estudiantat i personal.", p: 31 },
          { q: "Què s'ha d'agilitzar per facilitar l'atracció de talent (Art. 28.2)?", o: ["Els tràmits d'homologació i declaració d'equivalència de títols", "Les proves físiques d'accés", "L'obtenció del carnet de conduir", "El procés per comprar habitatge"], a: 0, exp: "El Govern ha d'agilitar i simplificar els tràmits d'homologació i d'equivalència.", p: 32 },
          { q: "Quin percentatge de places es reserva per a estudiants amb discapacitat (Art. 31.4)?", o: ["Un 5 per cent de les places", "Un 1 per cent", "Un 10 per cent", "No hi ha quota de reserva"], a: 0, exp: "Es reserva com a mínim un 5 per cent de les places ofertes.", p: 33 },
          { q: "A quins criteris respon prioritàriament la concessió de beques (Art. 32.4)?", o: ["A criteris socioeconòmics", "A l'expedient exclusivament", "A la edat del sol·licitant", "A la zona de residència sense tenir en compte els ingressos"], a: 0, exp: "La concessió respon prioritàriament i fonamentalment a criteris socioeconòmics.", p: 34 },
          { q: "Quin dret relacionat amb manifestacions col·lectives s'atorga a l'estudiantat (Art. 33.p)?", o: ["El dret a l'atur acadèmic", "El dret a no pagar matrícula durant vagues", "El dret a aprovar sense examinar-se", "El dret a triar els catedràtics"], a: 0, exp: "Es reconeix l'atur acadèmic, respectant el dret a l'educació de l'estudiantat.", p: 35 },
          { q: "Quina mesura d'acció positiva cal adoptar respecte a l'estudiantat amb discapacitat (Art. 37.2)?", o: ["Efectuar ajustos raonables curriculars i metodològics", "Eximir-los de l'assistència", "Aprovar-los automàticament", "Reduir els crèdits del grau"], a: 0, exp: "S'han d'adoptar ajustos raonables curriculars, metodològics i d'avaluació.", p: 36 },
          { q: "Quina obligació té l'estudiantat universitari segons l'Art. 36?", o: ["Respectar la normativa universitària de convivència", "Assumir tasques docents obligatòries", "Finançar la recerca", "Estar associat a un sindicat"], a: 0, exp: "L'estudiantat queda subjecte a respectar la normativa de convivència.", p: 37 },
          { q: "Qui comprova la legalitat i aprova els estatuts d'una universitat pública (Art. 38.1)?", o: ["La comunitat autònoma", "El Ministeri de Justícia", "El Consell d'Estat", "L'Ajuntament"], a: 0, exp: "Després que se n'hagi comprovat la legalitat, els aprova la comunitat autònoma.", p: 38 },
          { q: "Quin mecanisme de transparència han de tenir les universitats (Art. 39.3)?", o: ["Un portal de transparència", "Un canal de televisió propi", "Un diari imprès setmanal", "Un registre tancat al públic"], a: 0, exp: "Les universitats han de disposar d'un portal de transparència.", p: 39 },
          { q: "Qui acorda la creació, modificació i supressió de facultats i escoles (Art. 41.1)?", o: ["La comunitat autònoma, a proposta de la universitat", "El rector de forma unilateral", "El Govern central per decret", "El Consell d'Estudiants"], a: 0, exp: "L'acorda la comunitat autònoma, a iniciativa de la universitat (Consell de Govern).", p: 40 },
          { q: "Què requereix l'adscripció de centres docents universitaris (Art. 42.1)?", o: ["La formalització prèvia d'un conveni amb la universitat", "El pagament d'una taxa autonòmica alta", "Que el centre sigui obligatòriament de naturalesa privada", "Que els professors tinguin plaça fixa de funcionari"], a: 0, exp: "Requereix la formalització prèvia d'un conveni amb la universitat.", p: 41 },
          { q: "De quina d'aquestes unitats bàsiques han de disposar les universitats (Art. 43.1)?", o: ["Unitats d'igualtat i de diversitat", "Un cos de policia universitari", "Un registre mercantil", "Un servei nacional de duanes"], a: 0, exp: "Han de disposar d'unitats d'igualtat i diversitat, defensoria universitària, etc.", p: 42 },
          { q: "Quina és la durada del mandat dels titulars d'òrgans unipersonals electes (Art. 44.3)?", o: ["Sis anys improrrogables i no renovables", "Quatre anys, renovables una vegada", "Cinc anys renovables", "Fins a la jubilació"], a: 0, exp: "El mandat és, en tots els casos, de sis anys improrrogables i no renovables.", p: 43 },
          { q: "Quin és el màxim òrgan de representació i participació de la comunitat universitària (Art. 45.1)?", o: ["El Claustre Universitari", "El Consell de Govern", "La Junta de Facultat", "El Consell Social"], a: 0, exp: "El Claustre Universitari és el màxim òrgan de representació i participació.", p: 44 },
          { q: "Quina és la funció fonamental del Consell de Govern (Art. 46.1)?", o: ["És el màxim òrgan de govern de la universitat", "És l'òrgan només pels estudiants", "Recapta fons exclusivament", "Només té funcions disciplinàries"], a: 0, exp: "El Consell de Govern és el màxim òrgan de govern de la universitat.", p: 45 },

        ];

        // Variables d'estat
        let currentQuestionIndex = 0;
        let score = 0;
        let hasAnswered = false;
        let currentOptionsMapped = [];

        // Elements del DOM
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const explanationCard = document.getElementById('explanation-card');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const explanationText = document.getElementById('explanation-text');
        const referenceText = document.getElementById('reference-text');
        const nextBtn = document.getElementById('next-btn');
        const quizCard = document.getElementById('quiz-card');
        const resultsCard = document.getElementById('results-card');
        const progressBar = document.getElementById('progress-bar');
        const questionCounter = document.getElementById('question-counter');
        const scoreCounter = document.getElementById('score-counter');
        const restartBtn = document.getElementById('restart-btn');
        const finalScore = document.getElementById('final-score');
        const totalQuestions = document.getElementById('total-questions');

        // Inicialització
        function initApp() {
            currentQuestionIndex = 0;
            score = 0;
            resultsCard.classList.add('hidden');
            quizCard.classList.remove('hidden');
            updateUI();
            loadQuestion();
        }

        // Funció per barrejar un array (Fisher-Yates shuffle)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Carregar pregunta actual
        function loadQuestion() {
            hasAnswered = false;
            explanationCard.classList.add('hidden');
            explanationCard.classList.remove('slide-up');
            
            const q = questionsData[currentQuestionIndex];
            questionText.textContent = q.q;
            
            // Netejar opcions prèvies
            optionsContainer.innerHTML = '';
            
            // Mapar les opcions per guardar quina era la correcta (índex 'a') abans de barrejar
            currentOptionsMapped = q.o.map((optText, index) => {
                return {
                    text: optText,
                    isCorrect: index === q.a
                };
            });
            
            // Barrejar les opcions perquè la correcta no estigui sempre al mateix lloc
            currentOptionsMapped = shuffleArray(currentOptionsMapped);
            
            // Generar botons d'opció a la interfície
            currentOptionsMapped.forEach((optObj, renderedIndex) => {
                const button = document.createElement('button');
                button.className = "option-btn w-full text-left p-4 md:p-5 rounded-xl border-2 border-slate-200 bg-white font-medium text-slate-700 hover:border-brand-300 hover:bg-brand-50 flex items-center";
                button.innerHTML = `
                    <div class="w-8 h-8 rounded-full border-2 border-slate-300 flex items-center justify-center mr-4 flex-shrink-0 option-circle transition-colors">
                        <span class="text-sm option-letter"></span>
                    </div>
                    <span>${optObj.text}</span>
                `;
                button.onclick = () => selectOption(renderedIndex, button);
                optionsContainer.appendChild(button);
            });

            updateUI();
        }

        // Gestionar selecció d'una resposta
        function selectOption(selectedIndex, selectedBtn) {
            if (hasAnswered) return; // Evitar respostes múltiples
            hasAnswered = true;

            const q = questionsData[currentQuestionIndex];
            const isCorrect = currentOptionsMapped[selectedIndex].isCorrect;
            const buttons = optionsContainer.querySelectorAll('button');

            if (isCorrect) score++;

            // Estilitzar botons basant-se en la resposta
            buttons.forEach((btn, index) => {
                btn.disabled = true;
                btn.classList.remove('hover:border-brand-300', 'hover:bg-brand-50', 'cursor-pointer');
                
                const circle = btn.querySelector('.option-circle');
                const btnIsCorrectOpt = currentOptionsMapped[index].isCorrect;
                
                if (btnIsCorrectOpt) {
                    // Estil per a la resposta correcta
                    btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-800');
                    circle.classList.remove('border-slate-300');
                    circle.classList.add('border-emerald-500', 'bg-emerald-500', 'text-white');
                    circle.innerHTML = '<i class="fas fa-check"></i>';
                } else if (index === selectedIndex && !isCorrect) {
                    // Estil per a la resposta incorrecta seleccionada
                    btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-800');
                    circle.classList.remove('border-slate-300');
                    circle.classList.add('border-rose-500', 'bg-rose-500', 'text-white');
                    circle.innerHTML = '<i class="fas fa-times"></i>';
                } else {
                    // Desactivar les restants
                    btn.classList.add('opacity-50', 'bg-slate-50');
                }
            });

            showExplanation(isCorrect, q);
            updateUI();
        }

        // Mostrar el panell d'explicació inferior
        function showExplanation(isCorrect, questionData) {
            // Configurar icona i títol
            if (isCorrect) {
                feedbackIcon.innerHTML = '<div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600"><i class="fas fa-check text-xl"></i></div>';
                feedbackTitle.textContent = "¡Correcte!";
                feedbackTitle.className = "text-xl font-bold text-emerald-700 mb-2";
            } else {
                feedbackIcon.innerHTML = '<div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center text-rose-600"><i class="fas fa-times text-xl"></i></div>';
                feedbackTitle.textContent = "Incorrecte";
                feedbackTitle.className = "text-xl font-bold text-rose-700 mb-2";
            }

            // Inserir text i l'exacta referència requerida
            explanationText.innerHTML = `<strong>Explicació:</strong> ${questionData.exp}`;
            referenceText.textContent = `Document de referència: 2043462.pdf - Pàgina ${questionData.p}`;

            // Mostrar el panell amb animació
            explanationCard.classList.remove('hidden');
            // Hack per re-activar l'animació CSS
            void explanationCard.offsetWidth; 
            explanationCard.classList.add('slide-up');
            
            // Fer scroll automàtic si es necessari a dispositius petits
            setTimeout(() => {
                explanationCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        // Gestionar pas a la següent pregunta o finalització
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questionsData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // Mostrar pantalla final
        function showResults() {
            quizCard.classList.add('hidden');
            explanationCard.classList.add('hidden');
            resultsCard.classList.remove('hidden');
            
            finalScore.textContent = score;
            totalQuestions.textContent = questionsData.length;
            
            // Animar el bar de progrés al 100%
            progressBar.style.width = '100%';
            
            // Reposicionar al principi
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Actualitzar els indicadors visuals de UI (marcador, barra, etc.)
        function updateUI() {
            questionCounter.textContent = `Pregunta ${currentQuestionIndex + 1} de ${questionsData.length}`;
            scoreCounter.textContent = `Puntuació: ${score}`;
            
            const progressPercentage = ((currentQuestionIndex) / questionsData.length) * 100;
            progressBar.style.width = `${progressPercentage}%`;
        }

        // Event Listeners
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', initApp);

        // Iniciar aplicació al carregar
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
